# Roda o teste de fumaça do jogo (tests/SmokeTest.tscn) num Godot headless:
# abre todas as telas, simula toques e corre uma corrida completa de 3 voltas.
# Falha se o teste reportar FAIL/TIMEOUT ou se aparecer qualquer erro de script.
name: Smoke test (Godot)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.4.1"
  # SHA-512 oficial de Godot_v4.4.1-stable_linux.x86_64.zip (SHA512-SUMS.txt do release).
  # Ao trocar GODOT_VERSION, atualize também este hash.
  GODOT_SHA512: "ef4e76880a514257175544952c61191106fdef3095b909bafed9fcbeb230c3e5533920a0f3012882dd4bbde83028a67549825794e2d2c3cf76eba7918b71370e"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Cache do Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Baixar Godot ${{ env.GODOT_VERSION }}
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          zip="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -sSfL -o "/tmp/$zip" "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/$zip"
          echo "${GODOT_SHA512}  /tmp/$zip" | sha512sum -c -
          mkdir -p ~/godot
          unzip -q "/tmp/$zip" -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot

      - name: Importar projeto (gera o cache de classes)
        run: timeout 300 ~/godot/godot --headless --path . --import

      - name: Teste de fumaça
        run: |
          set -o pipefail
          timeout 600 ~/godot/godot --headless --path . res://tests/SmokeTest.tscn 2>&1 | tee smoke.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" smoke.log; then
            echo "::error::Erros de script no log do Godot"
            exit 1
          fi
          grep -q "\[smoke\] CHEGADA" smoke.log || { echo "::error::A corrida não terminou"; exit 1; }

      - name: Resumo
        if: always()
        run: |
          {
            echo "### Teste de fumaça — Godot ${GODOT_VERSION}"
            echo '```'
            grep "\[smoke\]" smoke.log || echo "(sem saída do teste)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-log
          path: smoke.log
